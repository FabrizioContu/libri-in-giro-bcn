<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App background -->
  <rect width="512" height="512" rx="96" fill="#3B6D11"/>

  <!-- Bookmark ribbon (peaks above book) -->
  <rect x="282" y="72" width="28" height="80" fill="#EAF3DE"/>
  <polygon points="282,152 296,172 310,152" fill="#EAF3DE"/>

  <!-- Book body (white cover) -->
  <rect x="112" y="100" width="288" height="316" rx="14" fill="#FFFFFF"/>

  <!-- Spine (dark green, left side of book) -->
  <rect x="112" y="100" width="72" height="316" rx="14 0 0 14" fill="#1E4A08"/>

  <!-- Spine inner highlight (subtle depth) -->
  <rect x="176" y="100" width="6" height="316" fill="rgba(0,0,0,0.07)"/>

  <!-- Title lines on cover -->
  <rect x="206" y="214" width="158" height="9" rx="4.5" fill="#3B6D11" opacity="0.22"/>
  <rect x="206" y="238" width="158" height="9" rx="4.5" fill="#3B6D11" opacity="0.22"/>
  <rect x="206" y="262" width="116" height="9" rx="4.5" fill="#3B6D11" opacity="0.22"/>

  <!-- Small circle ornament on spine -->
  <circle cx="148" cy="258" r="14" fill="rgba(255,255,255,0.15)"/>
</svg>
